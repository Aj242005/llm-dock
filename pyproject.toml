[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-docking"
version = "0.1.0"
description = "Backend for an LLM-augmented reasoning agent for autonomous satellite rendezvous and docking simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    "httpx>=0.27,<1.0",
    "sse-starlette>=2.1,<3.0",
    "structlog>=24.1,<25.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langchain-google-genai>=4.2,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.4,<1.0",
]
# RL/PPO controller (controller="rl"): training + inference.
# Torch CPU wheels are fine — no GPU is assumed.
rl = [
    "gymnasium>=1.0,<2.0",
    "stable-baselines3>=2.7,<3.0",
    "torch>=2.1",
    "tensorboard>=2.18,<3.0",
    "matplotlib>=3.8,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_rl.py" = ["E402"]
